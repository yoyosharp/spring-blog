spring:
  application:
    name: spring-blog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/starter}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:60000}
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    validate-on-migrate: true
    schemas: public
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:}
      password: ${SPRING_SECURITY_USER_PASSWORD:}
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: user:email,read:user
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/access_token
            user-info-uri: https://api.github.com/user
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: 3600
    fallback-to-system-locale: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

server:
  port: ${PORT:8088}

# JWT / AES / hashing keys. jwt.aes.* and app.hashing.* are carried over from
# application.properties.example; no code in the tree reads them today.
jwt:
  aes:
    key: ${JWT_AES_KEY:}
    iv: ${JWT_AES_IV:}
  rsa:
    path:
      private-key: ${JWT_RSA_PRIVATE_KEY_PATH:}
      public-key: ${JWT_RSA_PUBLIC_KEY_PATH:}
  expiration-time-in-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  clock-skew-in-seconds: ${JWT_CLOCK_SKEW_SECONDS:300}
  refresh-token:
    expiration-time-in-days: ${JWT_REFRESH_DAYS:30}

app:
  hashing:
    key: ${APP_HASHING_KEY:}
    iv: ${APP_HASHING_IV:}

# Not read by any code in the tree today; carried over from the .properties example.
application:
  defaultMailClient: ${DEFAULT_MAIL_CLIENT:GmailByJavaMailer}
  google:
    credentials:
      json: ${GOOGLE_CREDENTIALS_JSON:}

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    org:
      springframework:
        aop: DEBUG
        security: info
